name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies (Balıkçı Kenan)
        working-directory: balikci-kenan
        run: npm ci

      - name: Build Balıkçı Kenan
        working-directory: balikci-kenan
        run: npm run build

      - name: Install dependencies (Aras Cağ Kebap)
        working-directory: aras-cag-kebap
        run: npm ci

      - name: Build Aras Cağ Kebap
        working-directory: aras-cag-kebap
        run: npm run build

      - name: Install dependencies (Künefedeyiz)
        working-directory: kunefedeyiz
        run: npm ci

      - name: Build Künefedeyiz
        working-directory: kunefedeyiz
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/balikci-kenan _site/aras-cag-kebap _site/kunefedeyiz
          cp -R balikci-kenan/dist/. _site/balikci-kenan/
          cp -R aras-cag-kebap/dist/. _site/aras-cag-kebap/
          cp -R kunefedeyiz/dist/. _site/kunefedeyiz/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="tr">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width,initial-scale=1">
              <title>Revize Siteler</title>
              <style>
                body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#14110e;color:#f4efe8;margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem}
                main{max-width:36rem;width:100%}
                h1{font-size:1.5rem;font-weight:600;margin:0 0 1.5rem}
                ul{list-style:none;padding:0;margin:0;display:grid;gap:.75rem}
                a{display:block;padding:1rem 1.25rem;border:1px solid #3a332b;border-radius:.75rem;color:#f4efe8;text-decoration:none;transition:background .2s}
                a:hover{background:#221d18}
              </style>
            </head>
            <body>
              <main>
                <h1>Revize Siteler</h1>
                <ul>
                  <li><a href="./balikci-kenan/">Balıkçı Kenan</a></li>
                  <li><a href="./aras-cag-kebap/">Aras Cağ Kebap</a></li>
                  <li><a href="./kunefedeyiz/">Künefedeyiz</a></li>
                </ul>
              </main>
            </body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
