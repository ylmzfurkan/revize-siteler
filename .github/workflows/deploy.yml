name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: balikci-kenan/package-lock.json

      - name: Install dependencies
        working-directory: balikci-kenan
        run: npm ci

      - name: Build Balıkçı Kenan
        working-directory: balikci-kenan
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/balikci-kenan
          cp -R balikci-kenan/dist/. _site/balikci-kenan/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="tr">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width,initial-scale=1">
              <meta http-equiv="refresh" content="0;url=./balikci-kenan/">
              <title>Revize Siteler</title>
            </head>
            <body><a href="./balikci-kenan/">Balıkçı Kenan sitesini aç</a></body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
